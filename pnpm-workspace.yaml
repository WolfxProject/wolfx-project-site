allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# readdir-glob 3 only uses Minimatch's public matching API. Remove when
# archiver accepts readdir-glob 4 (GHSA-g3hv-75wg-m249).
overrides:
  'readdir-glob@3.0.0>minimatch': 11.0.9

permissions:
  '@nuxtjs/sitemap':
    skills: true

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
