# Include inside the wolfx.jp server block, with root pointing at .output/public.
set $wolfx_cache_control "public, max-age=0, must-revalidate";
add_header Cache-Control $wolfx_cache_control always;
add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy cross-origin always;
add_header Allow "GET, HEAD" always;

# The range filter sets Content-Range and changes the response status after
# headers have run. Preserve those headers when Nginx builds the 416 body.
error_page 416 = @wolfx_range_error;
location @wolfx_range_error {
    add_header Cache-Control "";
    return 416;
}

# Nuxt's top-level JS and CSS bundles are fingerprinted. Its build manifest
# at /_nuxt/builds/latest.json has a stable URL and must revalidate.
location ~ ^/_nuxt/[^/]+\.(?:js|css)$ {
    # Byte ranges and write preconditions can turn a file response into a
    # 416 or 412. Ordinary cache revalidation can still return an immutable 304.
    set $wolfx_bundle_request "$request_method:$http_range$http_if_match$http_if_unmodified_since";
    if ($wolfx_bundle_request ~ ^(GET|HEAD):$) {
        set $wolfx_cache_control "public, max-age=31536000, immutable";
    }
    try_files $uri =404;
}

location = /_headers { return 404; }
location = /ipleak.html { try_files $uri =404; }
location = /geiger/index.html { try_files $uri =404; }
location ~ \.html$ { return 404; }

location / {
    try_files $uri/index.html $uri =404;
}
