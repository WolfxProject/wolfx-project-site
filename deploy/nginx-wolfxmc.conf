# Use this file inside a dedicated mc.wolfx.jp server block whose root is the
# same generated .output/public directory as wolfx.jp. Include
# nginx-wolfxmc-redirects.conf before these locations.

location ^~ /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /_i18n/ {
    try_files $uri =404;
}

location ^~ /images/ {
    try_files $uri =404;
}

location = /search-index.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# Nuxt embeds the internal generated route in prerender payload URLs. These
# files must pass through unchanged instead of receiving another /mc prefix.
location ~ ^/(?:zh/|en/)?mc(?:/[^/]+)*/_payload\.json$ {
    try_files $uri =404;
}

location = /robots.txt {
    try_files /mc-robots.txt =404;
}

location = /sitemap.xml {
    try_files /mc-sitemap.xml =404;
}

location = /sitemap_index.xml {
    try_files /mc-sitemap.xml =404;
}

location = / {
    try_files /zh/mc/index.html =404;
}

location = /zh/ {
    try_files /zh/mc/index.html =404;
}

location = /en/ {
    try_files /en/mc/index.html =404;
}

location = /zh {
    return 301 /zh/$is_args$args;
}

location = /en {
    return 301 /en/$is_args$args;
}

location ~ ^/(.+)/$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(zh|en)(/.*)$ {
    try_files /$1/mc$2/index.html /$1/mc$2.html =404;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location / {
    try_files /zh/mc$uri/index.html /zh/mc$uri.html =404;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
